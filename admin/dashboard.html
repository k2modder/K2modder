<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>K2MODDER Admin Dashboard</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .admin-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .admin-btn {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #5b8cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-btn.logout {
      background: #333d50;
    }

    #status {
      margin-top: 15px;
      color: #9aa7bd;
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="nav-container">

    <a href="../index.html" class="logo">
      K2<span>MODDER</span>
    </a>

    <nav>
      <a href="../index.html">Home</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
    </nav>

  </div>
</header>

<main class="info-page">

  <div class="info-box">

    <span class="small-title">ADMIN PANEL</span>

    <h1>Welcome to K2MODDER</h1>

    <p>You are successfully logged in as an admin.</p>

    <div class="admin-actions">

      <button
        class="admin-btn"
        onclick="showAddApp() {
  const name = prompt("App Name:");
  if (!name) return;

  const category = prompt("Category (App/Game/Tools):");
  if (!category) return;

  const version = prompt("Version:");
  if (!version) return;

  const size = prompt("Size (example: 100 MB):");
  if (!size) return;

  const icon_url = prompt("Icon URL:");
  if (!icon_url) return;

  const download_url = prompt("Download URL:");
  if (!download_url) return;

  const { error } = await supabaseClient
    .from("apps")
    .insert({
      name: name,
      category: category,
      version: version,
      size: size,
      icon_url: icon_url,
      download_url: download_url
    });

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  alert("App added successfully!");
}()"
        Add App
      </button>

      <button
        class="admin-btn logout"
        onclick="logout()">
        Logout
      </button>

    </div>

    <p id="status"></p>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mcjsihyrkzrkvkufvkif.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rJ3XzXGztJJcf5c_wUG9FA_lZAsqlvf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkLogin() {

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if (error || !data.session) {

    window.location.href = "index.html";
    return;

  }

  const user = data.session.user;

  const {
    data: admin,
    error: adminError
  } = await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (adminError || !admin) {

    await supabaseClient.auth.signOut();

    alert("Access denied. Admin only.");

    window.location.href = "index.html";

    return;

  }

  document.getElementById("status").textContent =
    "Admin verification successful.";

}

function showAddApp() {
  const name = prompt("App Name:");
  if (!name) return;

  const category = prompt("Category (App/Game/Tools):");
  if (!category) return;

  const version = prompt("Version:");
  if (!version) return;

  const size = prompt("Size (example: 100 MB):");
  if (!size) return;

  const icon_url = prompt("Icon URL:");
  if (!icon_url) return;

  const download_url = prompt("Download URL:");
  if (!download_url) return;

  alert(
    "App details received!\n\n" +
    "Name: " + name + "\n" +
    "Category: " + category + "\n" +
    "Version: " + version + "\n" +
    "Size: " + size
  );
}
async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";

}


checkLogin();

</script>

</body>
</html>
