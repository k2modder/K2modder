<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>K2MODDER Admin Dashboard</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .admin-wrap {
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-box {
      background: #111827;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .admin-box h1,
    .admin-box h2 {
      color: #fff;
      margin-top: 0;
    }

    .admin-form {
      display: grid;
      gap: 14px;
    }

    .admin-form input,
    .admin-form select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: #0b1220;
      color: #fff;
      outline: none;
    }

    .admin-btn {
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: #5b8cff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-btn:hover {
      opacity: .9;
    }

    .logout-btn {
      background: #374151;
    }

    .edit-btn {
      background: #2563eb;
    }

    .delete-btn {
      background: #dc2626;
    }

    .cancel-btn {
      background: #4b5563;
    }

    .app-item {
      padding: 18px;
      margin-top: 14px;
      border-radius: 14px;
      background: #0b1220;
      border: 1px solid rgba(255,255,255,.08);
    }

    .app-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      object-fit: cover;
      background: #1f2937;
      flex-shrink: 0;
    }

    .app-details {
      flex: 1;
    }

    .app-details strong {
      color: #fff;
      font-size: 18px;
    }

    .app-details p {
      color: #9ca8bd;
      margin: 6px 0 0;
    }

    .app-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    #message {
      margin-top: 14px;
      color: #9ca8bd;
    }

    @media (max-width: 600px) {
      .admin-wrap {
        padding: 12px;
        margin-top: 20px;
      }

      .admin-box {
        padding: 18px;
      }

      .app-row {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="nav-container">

    <a href="../index.html" class="logo">
      K2<span>MODDER</span>
    </a>

    <nav>
      <a href="../index.html">Home</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
    </nav>

  </div>
</header>


<main class="admin-wrap">

  <!-- ADMIN -->

  <div class="admin-box">

    <span class="small-title">ADMIN PANEL</span>

    <h1>K2MODDER Dashboard</h1>

    <p>You are logged in as an administrator.</p>

    <button
      class="admin-btn logout-btn"
      onclick="logout()">
      Logout
    </button>

    <p id="status">Checking admin access...</p>

  </div>


  <!-- ADD / EDIT APP -->

  <div class="admin-box">

    <h2 id="formTitle">Add New App</h2>

    <form
      class="admin-form"
      id="appForm">

      <input
        id="appName"
        type="text"
        placeholder="App Name"
        required>

      <select
        id="appCategory"
        required>

        <option value="">Select Category</option>
        <option value="App">App</option>
        <option value="Game">Game</option>
        <option value="Tools">Tools</option>

      </select>

      <input
        id="appVersion"
        type="text"
        placeholder="Version e.g. 1.0.0"
        required>

      <input
        id="appSize"
        type="text"
        placeholder="Size e.g. 100 MB"
        required>

      <input
        id="iconUrl"
        type="url"
        placeholder="Icon URL"
        required>

      <input
        id="downloadUrl"
        type="url"
        placeholder="Download URL"
        required>

      <button
        class="admin-btn"
        id="saveButton"
        type="submit">
        Save App
      </button>

      <button
        class="admin-btn cancel-btn"
        id="cancelEdit"
        type="button"
        onclick="cancelEdit()"
        style="display:none;">
        Cancel Edit
      </button>

    </form>

    <p id="message"></p>

  </div>


  <!-- APP LIST -->

  <div class="admin-box">

    <h2>Saved Apps</h2>

    <div id="appList">
      Loading apps...
    </div>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://mcjsihyrkzrkvkufvkif.supabase.co";


/*
  अपनी existing Supabase PUBLISHABLE KEY
  यहाँ रखो।

  sb_publishable_... वाली key इस्तेमाल करो।
  Service Role / Secret key मत डालना।
*/

const SUPABASE_KEY =
  "YOUR_EXISTING_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingId = null;


/* ADMIN LOGIN CHECK */

async function checkLogin() {

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();


  if (error || !data.session) {

    window.location.href = "index.html";

    return;

  }


  const user =
    data.session.user;


  const {
    data: admin,
    error: adminError
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  if (adminError || !admin) {

    await supabaseClient.auth.signOut();

    alert("Access denied. Admin only.");

    window.location.href = "index.html";

    return;

  }


  document.getElementById("status").textContent =
    "Admin verification successful.";


  loadApps();

}


/* LOGOUT */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";

}


/* ADD / UPDATE APP */

document
  .getElementById("appForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();


    const message =
      document.getElementById("message");

    message.textContent =
      "Saving...";


    const appData = {

      name:
        document.getElementById("appName")
          .value.trim(),

      category:
        document.getElementById("appCategory")
          .value,

      version:
        document.getElementById("appVersion")
          .value.trim(),

      size:
        document.getElementById("appSize")
          .value.trim(),

      icon_url:
        document.getElementById("iconUrl")
          .value.trim(),

      download_url:
        document.getElementById("downloadUrl")
          .value.trim()

    };


    let error;


    if (editingId) {

      const result =
        await supabaseClient
          .from("apps")
          .update(appData)
          .eq("id", editingId);

      error = result.error;

    } else {

      const result =
        await supabaseClient
          .from("apps")
          .insert(appData);

      error = result.error;

    }


    if (error) {

      message.textContent =
        "Error: " + error.message;

      return;

    }


    message.textContent =
      editingId
        ? "App updated successfully!"
        : "App added successfully!";


    document
      .getElementById("appForm")
      .reset();


    editingId = null;


    document.getElementById("formTitle")
      .textContent = "Add New App";


    document.getElementById("saveButton")
      .textContent = "Save App";


    document.getElementById("cancelEdit")
      .style.display = "none";


    loadApps();

  });


/* LOAD APPS */

async function loadApps() {

  const appList =
    document.getElementById("appList");


  appList.innerHTML =
    "Loading apps...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("apps")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    appList.innerHTML =
      "<p>Unable to load apps.</p>";

    return;

  }


  if (!data || data.length === 0) {

    appList.innerHTML =
      "<p>No apps added yet.</p>";

    return;

  }


  appList.innerHTML =
    data.map(function(app) {

      const icon =
        app.icon_url
          ? `
            <img
              class="app-icon"
              src="${escapeHtml(app.icon_url)}"
              alt="${escapeHtml(app.name)}">
          `
          : `
            <div class="app-icon"></div>
          `;


      return `

        <div class="app-item">

          <div class="app-row">

            ${icon}

            <div class="app-details">

              <strong>
                ${escapeHtml(app.name)}
              </strong>

              <p>
                ${escapeHtml(app.category)}
                • v${escapeHtml(app.version || "")}
                • ${escapeHtml(app.size || "")}
              </p>

            </div>

          </div>


          <div class="app-actions">

            <button
              class="admin-btn edit-btn"
              onclick="editApp(${app.id})">
              Edit
            </button>

            <button
              class="admin-btn delete-btn"
              onclick="deleteApp(${app.id})">
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* EDIT APP */

async function editApp(id) {

  const {
    data: app,
    error
  } =
    await supabaseClient
      .from("apps")
      .select("*")
      .eq("id", id)
      .single();


  if (error || !app) {

    alert("Unable to load app.");

    return;

  }


  editingId = id;


  document.getElementById("appName")
    .value = app.name || "";


  document.getElementById("appCategory")
    .value = app.category || "";


  document.getElementById("appVersion")
    .value = app.version || "";


  document.getElementById("appSize")
    .value = app.size || "";


  document.getElementById("iconUrl")
    .value = app.icon_url || "";


  document.getElementById("downloadUrl")
    .value = app.download_url || "";


  document.getElementById("formTitle")
    .textContent = "Edit App";


  document.getElementById("saveButton")
    .textContent = "Update App";


  document.getElementById("cancelEdit")
    .style.display = "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* CANCEL EDIT */

function cancelEdit() {

  editingId = null;


  document
    .getElementById("appForm")
    .reset();


  document.getElementById("formTitle")
    .textContent = "Add New App";


  document.getElementById("saveButton")
    .textContent = "Save App";


  document.getElementById("cancelEdit")
    .style.display = "none";


  document.getElementById("message")
    .textContent = "";

}


/* DELETE APP */

async function deleteApp(id) {

  const confirmDelete =
    confirm(
      "Are you sure you want to delete this app?"
    );


  if (!confirmDelete) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("apps")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Delete failed: " +
      error.message
    );

    return;

  }


  alert("App deleted successfully!");


  loadApps();

}


/* SECURITY */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/* START */

checkLogin();

</script>

</body>
</html>
