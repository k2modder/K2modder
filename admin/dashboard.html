<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1">

  <title>K2MODDER Admin Dashboard</title>

  <link
    rel="icon"
    href="../favicon.png">

  <link
    rel="stylesheet"
    href="../style.css">

  <style>

    /* =========================
       ADMIN LAYOUT
    ========================= */

    .admin-wrap{
      max-width:1050px;
      margin:0 auto;
      padding:40px 20px 70px;
    }

    .admin-box{
      margin-bottom:24px;
      padding:28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.07),
          rgba(255,255,255,.025)
        );

      border:1px solid rgba(255,255,255,.09);
      border-radius:24px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.16);
    }

    .admin-box h1,
    .admin-box h2{
      margin-top:0;
      color:#fff;
    }

    .admin-box h1{
      margin-bottom:8px;
      font-size:clamp(30px,5vw,44px);
      letter-spacing:-1.5px;
    }

    .admin-box h2{
      margin-bottom:20px;
      font-size:27px;
      letter-spacing:-.7px;
    }

    .admin-box > p{
      color:#98a6bd;
      line-height:1.6;
    }


    /* =========================
       ADMIN HEADER
    ========================= */

    .site-header{
      position:sticky;
      top:0;
      z-index:1000;

      background:rgba(5,8,17,.88);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .nav-container{
      max-width:1050px;
      margin:auto;

      padding:15px 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .nav-container .logo{
      color:#fff;
    }

    .nav-container nav{
      display:flex;
      gap:8px;
    }

    .nav-container nav a{
      padding:9px 13px;

      color:#9aa7bd;

      border-radius:10px;

      font-size:13px;
      font-weight:bold;
    }

    .nav-container nav a:hover{
      color:#fff;
      background:rgba(255,255,255,.06);
    }


    /* =========================
       STATUS
    ========================= */

    .admin-status{
      display:flex;
      align-items:center;
      gap:8px;

      margin-top:18px;

      color:#7fe4aa;
      font-size:13px;
      font-weight:bold;
    }

    .status-dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:#39d98a;

      box-shadow:
        0 0 12px rgba(57,217,138,.7);
    }


    /* =========================
       STATS
    ========================= */

    .admin-stats{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:15px;

      margin-top:25px;
    }

    .stat{
      padding:20px;

      background:rgba(255,255,255,.035);

      border:1px solid rgba(255,255,255,.07);

      border-radius:18px;
    }

    .stat-label{
      color:#8997ad;
      font-size:12px;
    }

    .stat-value{
      margin-top:6px;

      color:#fff;

      font-size:28px;
      font-weight:900;
    }


    /* =========================
       FORM
    ========================= */

    .admin-form{
      display:grid;
      gap:14px;
    }

    .admin-form input,
    .admin-form select{
      width:100%;

      padding:15px;

      border:1px solid rgba(255,255,255,.10);
      border-radius:13px;

      outline:none;

      background:#09111f;
      color:#fff;

      font-size:15px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .admin-form input::placeholder{
      color:#697890;
    }

    .admin-form input:focus,
    .admin-form select:focus{
      border-color:rgba(91,140,255,.65);

      box-shadow:
        0 0 0 3px rgba(91,140,255,.08);
    }

    .admin-form select{
      cursor:pointer;
    }


    /* =========================
       ICON PREVIEW
    ========================= */

    .icon-preview-wrap{
      display:none;

      align-items:center;
      gap:14px;

      padding:12px;

      border:1px solid rgba(255,255,255,.07);

      border-radius:15px;

      background:rgba(255,255,255,.025);
    }

    .icon-preview{
      width:62px;
      height:62px;

      border-radius:16px;

      object-fit:cover;

      background:#172238;

      border:1px solid rgba(255,255,255,.08);
    }

    .preview-text{
      color:#98a6bd;
      font-size:12px;
    }


    /* =========================
       BUTTONS
    ========================= */

    .admin-btn{
      padding:13px 18px;

      border:0;
      border-radius:12px;

      color:#fff;

      font-weight:bold;

      cursor:pointer;

      transition:
        transform .2s ease,
        filter .2s ease;
    }

    .admin-btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.1);
    }

    .admin-btn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .save-btn{
      background:
        linear-gradient(
          100deg,
          #5b8cff,
          #805cff
        );
    }

    .logout-btn{
      background:#303b4e;
    }

    .edit-btn{
      background:#2563eb;
    }

    .delete-btn{
      background:#dc2626;
    }

    .cancel-btn{
      background:#4b5563;
    }


    /* =========================
       MESSAGE
    ========================= */

    #message{
      min-height:20px;

      margin:15px 0 0;

      color:#9aa7bd;

      font-size:13px;
    }


    /* =========================
       APP SEARCH
    ========================= */

    .saved-search{
      margin-bottom:18px;
    }

    .saved-search input{
      width:100%;

      padding:14px 15px;

      border:1px solid rgba(255,255,255,.09);
      border-radius:13px;

      outline:none;

      background:#09111f;
      color:#fff;

      font-size:14px;
    }

    .saved-search input::placeholder{
      color:#697890;
    }


    /* =========================
       APP LIST
    ========================= */

    .app-item{
      margin-top:13px;
      padding:18px;

      background:#09111f;

      border:1px solid rgba(255,255,255,.08);

      border-radius:17px;

      transition:
        border-color .2s ease,
        transform .2s ease;
    }

    .app-item:hover{
      border-color:rgba(91,140,255,.35);
    }

    .app-row{
      display:flex;
      align-items:center;

      gap:15px;
    }

    .app-icon{
      width:64px;
      height:64px;

      border-radius:16px;

      object-fit:cover;

      background:#172238;

      border:1px solid rgba(255,255,255,.08);

      flex-shrink:0;
    }

    .app-details{
      flex:1;
      min-width:0;
    }

    .app-details strong{
      display:block;

      color:#fff;

      font-size:18px;

      word-break:break-word;
    }

    .app-details p{
      margin:6px 0 0;

      color:#8e9bb0;

      font-size:13px;

      line-height:1.5;
    }

    .app-actions{
      display:flex;

      gap:8px;

      margin-top:14px;

      flex-wrap:wrap;
    }

    .app-actions .admin-btn{
      padding:10px 15px;
      font-size:13px;
    }


    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state{
      padding:30px 15px;

      text-align:center;

      color:#8e9bb0;
    }

    .empty-state strong{
      display:block;

      margin-bottom:7px;

      color:#fff;

      font-size:18px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width:650px){

      .admin-wrap{
        padding:25px 13px 55px;
      }

      .admin-box{
        padding:20px;

        border-radius:20px;
      }

      .nav-container{
        padding:13px 12px;
      }

      .nav-container nav a{
        padding:7px 9px;
        font-size:11px;
      }

      .admin-stats{
        grid-template-columns:1fr;
        gap:10px;
      }

      .stat{
        padding:16px;
      }

      .stat-value{
        font-size:24px;
      }

      .app-row{
        align-items:flex-start;
      }

      .app-icon{
        width:58px;
        height:58px;
      }

      .app-details strong{
        font-size:16px;
      }

      .app-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
      }

      .app-actions .admin-btn{
        width:100%;
      }
    }

  </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="site-header">

  <div class="nav-container">

    <a
      href="../index.html"
      class="logo">

      K2<span>MODDER</span>

    </a>

    <nav>

      <a href="../index.html">
        Home
      </a>

      <a
        href="#"
        onclick="logout(); return false;">

        Logout

      </a>

    </nav>

  </div>

</header>



<main class="admin-wrap">


<!-- =========================
     DASHBOARD
========================= -->

<section class="admin-box">

  <span class="small-title">
    ADMIN PANEL
  </span>

  <h1>
    K2MODDER Dashboard
  </h1>

  <p>
    Manage apps displayed on the public website.
  </p>

  <div class="admin-status">

    <span class="status-dot"></span>

    <span id="status">
      Checking admin access...
    </span>

  </div>


  <div class="admin-stats">

    <div class="stat">

      <div class="stat-label">
        Total Apps
      </div>

      <div
        class="stat-value"
        id="totalApps">

        0

      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Categories
      </div>

      <div
        class="stat-value"
        id="totalCategories">

        0

      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Status
      </div>

      <div
        class="stat-value"
        style="font-size:20px;">

        Online

      </div>

    </div>

  </div>


  <br>

  <button
    class="admin-btn logout-btn"
    onclick="logout()">

    Logout

  </button>

</section>



<!-- =========================
     ADD / EDIT APP
========================= -->

<section class="admin-box">

  <span class="small-title">
    APP MANAGEMENT
  </span>

  <h2 id="formTitle">
    Add New App
  </h2>


  <form
    class="admin-form"
    id="appForm">


    <input
      id="appName"
      type="text"
      maxlength="100"
      placeholder="App Name"
      required>


    <select
      id="appCategory"
      required>

      <option value="">
        Select Category
      </option>

      <option value="App">
        App
      </option>

      <option value="Game">
        Game
      </option>

      <option value="Tools">
        Tools
      </option>

    </select>


    <input
      id="appVersion"
      type="text"
      maxlength="30"
      placeholder="Version e.g. 1.0.0"
      required>


    <input
      id="appSize"
      type="text"
      maxlength="30"
      placeholder="Size e.g. 100 MB"
      required>


    <input
      id="iconUrl"
      type="url"
      placeholder="Icon URL"
      required>


    <div
      class="icon-preview-wrap"
      id="iconPreviewWrap">

      <img
        id="iconPreview"
        class="icon-preview"
        alt="Icon preview">

      <span class="preview-text">
        Icon preview
      </span>

    </div>


    <input
      id="downloadUrl"
      type="url"
      placeholder="Download URL"
      required>


    <button
      class="admin-btn save-btn"
      id="saveButton"
      type="submit">

      Save App

    </button>


    <button
      class="admin-btn cancel-btn"
      id="cancelEdit"
      type="button"
      onclick="cancelEdit()"
      style="display:none;">

      Cancel Edit

    </button>

  </form>


  <p id="message"></p>

</section>



<!-- =========================
     SAVED APPS
========================= -->

<section class="admin-box">

  <span class="small-title">
    DATABASE
  </span>

  <h2>
    Saved Apps
  </h2>


  <div class="saved-search">

    <input
      id="savedSearch"
      type="search"
      placeholder="Search saved apps...">

  </div>


  <div id="appList">

    Loading apps...

  </div>

</section>


</main>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://mcjsihyrkzrkvkufvkif.supabase.co";


const SUPABASE_KEY =
  "YOUR_EXISTING_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingId = null;
let savedApps = [];


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   LOGIN CHECK
========================= */

async function checkLogin(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if(
    error ||
    !data.session
  ){

    window.location.href =
      "index.html";

    return;

  }


  const user =
    data.session.user;


  const {
    data: admin,
    error: adminError
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(
    adminError ||
    !admin
  ){

    await supabaseClient
      .auth
      .signOut();

    alert(
      "Access denied. Admin only."
    );

    window.location.href =
      "index.html";

    return;

  }


  document
    .getElementById("status")
    .textContent =
      "Admin verification successful.";


  loadApps();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient
    .auth
    .signOut();

  window.location.href =
    "index.html";

}


/* =========================
   ICON PREVIEW
========================= */

const iconUrlInput =
  document.getElementById(
    "iconUrl"
  );

const iconPreviewWrap =
  document.getElementById(
    "iconPreviewWrap"
  );

const iconPreview =
  document.getElementById(
    "iconPreview"
  );


iconUrlInput.addEventListener(
  "input",
  function(){

    const url =
      iconUrlInput.value.trim();


    if(!url){

      iconPreviewWrap.style.display =
        "none";

      return;

    }


    iconPreview.src = url;

    iconPreview.onload =
      function(){

        iconPreviewWrap.style.display =
          "flex";

      };


    iconPreview.onerror =
      function(){

        iconPreviewWrap.style.display =
          "none";

      };

  }
);


/* =========================
   FORM SUBMIT
========================= */

document
  .getElementById("appForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const message =
        document.getElementById(
          "message"
        );

      const saveButton =
        document.getElementById(
          "saveButton"
        );


      const appData = {

        name:
          document
            .getElementById("appName")
            .value
            .trim(),

        category:
          document
            .getElementById("appCategory")
            .value,

        version:
          document
            .getElementById("appVersion")
            .value
            .trim(),

        size:
          document
            .getElementById("appSize")
            .value
            .trim(),

        icon_url:
          document
            .getElementById("iconUrl")
            .value
            .trim(),

        download_url:
          document
            .getElementById("downloadUrl")
            .value
            .trim()

      };


      if(
        !appData.name ||
        !appData.category ||
        !appData.version ||
        !appData.size ||
        !appData.icon_url ||
        !appData.download_url
      ){

        message.textContent =
          "Please fill all fields.";

        return;

      }


      saveButton.disabled = true;

      saveButton.textContent =
        editingId
          ? "Updating..."
          : "Saving...";


      message.textContent =
        "";


      let error;


      if(editingId){

        const result =
          await supabaseClient
            .from("apps")
            .update(appData)
            .eq(
              "id",
              editingId
            );

        error =
          result.error;

      }else{

        const result =
          await supabaseClient
            .from("apps")
            .insert(appData);

        error =
          result.error;

      }


      saveButton.disabled =
        false;


      if(error){

        console.error(error);

        message.textContent =
          "Error: " +
          error.message;

        saveButton.textContent =
          editingId
            ? "Update App"
            : "Save App";

        return;

      }


      message.textContent =
        editingId
          ? "App updated successfully!"
          : "App added successfully!";


      resetForm();

      loadApps();

    }
  );


/* =========================
   RESET FORM
========================= */

function resetForm(){

  editingId = null;


  document
    .getElementById("appForm")
    .reset();


  document
    .getElementById("formTitle")
    .textContent =
      "Add New App";


  document
    .getElementById("saveButton")
    .textContent =
      "Save App";


  document
    .getElementById("cancelEdit")
    .style.display =
      "none";


  document
    .getElementById("iconPreviewWrap")
    .style.display =
      "none";

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  resetForm();

  document
    .getElementById("message")
    .textContent =
      "";

}


/* =========================
   LOAD APPS
========================= */

async function loadApps(){

  const appList =
    document.getElementById(
      "appList"
    );


  appList.innerHTML =
    "Loading apps...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("apps")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    appList.innerHTML = `
      <div class="empty-state">
        <strong>
          Unable to load apps
        </strong>
        Please try again.
      </div>
    `;

    return;

  }


  savedApps =
    data || [];


  updateStats();

  renderSavedApps(
    savedApps
  );

}


/* =========================
   STATS
========================= */

function updateStats(){

  document
    .getElementById("totalApps")
    .textContent =
      savedApps.length;


  const categories =
    new Set(
      savedApps
        .map(
          app =>
            app.category
        )
        .filter(Boolean)
    );


  document
    .getElementById(
      "totalCategories"
    )
    .textContent =
      categories.size;

}


/* =========================
   RENDER SAVED APPS
========================= */

function renderSavedApps(apps){

  const appList =
    document.getElementById(
      "appList"
    );


  if(
    !apps ||
    apps.length === 0
  ){

    appList.innerHTML = `
      <div class="empty-state">
        <strong>
          No apps found
        </strong>
        Add your first app above.
      </div>
    `;

    return;

  }


  appList.innerHTML =
    apps
      .map(
        function(app){

          const icon =
            app.icon_url
              ? `
                <img
                  class="app-icon"
                  src="${escapeHtml(app.icon_url)}"
                  alt="${escapeHtml(app.name)}"
                  loading="lazy">
              `
              : `
                <div class="app-icon">
                </div>
              `;


          return `

            <div class="app-item">

              <div class="app-row">

                ${icon}

                <div class="app-details">

                  <strong>
                    ${escapeHtml(app.name)}
                  </strong>

                  <p>
                    ${escapeHtml(app.category || "App")}
                    • v${escapeHtml(app.version || "N/A")}
                    • ${escapeHtml(app.size || "Unknown")}
                  </p>

                </div>

              </div>


              <div class="app-actions">

                <button
                  class="admin-btn edit-btn"
                  onclick="editApp(${Number(app.id)})">

                  Edit

                </button>


                <button
                  class="admin-btn delete-btn"
                  onclick="deleteApp(${Number(app.id)})">

                  Delete

                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================
   SEARCH SAVED APPS
========================= */

document
  .getElementById("savedSearch")
  .addEventListener(
    "input",
    function(){

      const query =
        this.value
          .trim()
          .toLowerCase();


      const filtered =
        savedApps.filter(
          function(app){

            return (

              String(
                app.name || ""
              )
                .toLowerCase()
                .includes(query)

              ||

              String(
                app.category || ""
              )
                .toLowerCase()
                .includes(query)

            );

          }
        );


      renderSavedApps(
        filtered
      );

    }
  );


/* =========================
   EDIT APP
========================= */

async function editApp(id){

  const {
    data: app,
    error
  } =
    await supabaseClient
      .from("apps")
      .select("*")
      .eq("id",id)
      .single();


  if(
    error ||
    !app
  ){

    alert(
      "Unable to load app."
    );

    return;

  }


  editingId = id;


  document
    .getElementById("appName")
    .value =
      app.name || "";


  document
    .getElementById("appCategory")
    .value =
      app.category || "";


  document
    .getElementById("appVersion")
    .value =
      app.version || "";


  document
    .getElementById("appSize")
    .value =
      app.size || "";


  document
    .getElementById("iconUrl")
    .value =
      app.icon_url || "";


  document
    .getElementById("downloadUrl")
    .value =
      app.download_url || "";


  document
    .getElementById("formTitle")
    .textContent =
      "Edit App";


  document
    .getElementById("saveButton")
    .textContent =
      "Update App";


  document
    .getElementById("cancelEdit")
    .style.display =
      "block";


  if(app.icon_url){

    iconPreview.src =
      app.icon_url;

    iconPreviewWrap.style.display =
      "flex";

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE APP
========================= */

async function deleteApp(id){

  const app =
    savedApps.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  const appName =
    app
      ? app.name
      : "this app";


  const confirmed =
    confirm(
      `Delete "${appName}"?`
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("apps")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(
