<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>K2MODDER Admin Dashboard</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .admin-wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-box {
      background: #111827;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .admin-box h2 {
      color: white;
      margin-top: 0;
    }

    .admin-form {
      display: grid;
      gap: 14px;
    }

    .admin-form input,
    .admin-form select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: #0b1220;
      color: white;
      outline: none;
    }

    .admin-btn {
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: #5b8cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-btn {
      background: #374151;
    }

    .app-item {
      padding: 16px;
      margin-top: 12px;
      border-radius: 12px;
      background: #0b1220;
      border: 1px solid rgba(255,255,255,.08);
    }

    .app-item strong {
      color: white;
    }

    .app-item p {
      color: #9ca8bd;
      margin: 6px 0;
    }

    #message {
      margin-top: 12px;
      color: #9ca8bd;
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="nav-container">

    <a href="../index.html" class="logo">
      K2<span>MODDER</span>
    </a>

    <nav>
      <a href="../index.html">Home</a>
      <a href="#" onclick="logout(); return false;">Logout</a>
    </nav>

  </div>
</header>


<main class="admin-wrap">

  <!-- ADMIN DASHBOARD -->

  <div class="admin-box">

    <span class="small-title">ADMIN PANEL</span>

    <h1>Welcome to K2MODDER</h1>

    <p>You are successfully logged in as an admin.</p>

    <button
      class="admin-btn logout-btn"
      onclick="logout()">
      Logout
    </button>

    <p id="status">Checking admin access...</p>

  </div>


  <!-- ADD APP -->

  <div class="admin-box">

    <h2>Add New App</h2>

    <form
      class="admin-form"
      id="addAppForm">

      <input
        id="appName"
        type="text"
        placeholder="App Name"
        required>

      <select
        id="appCategory"
        required>

        <option value="">Select Category</option>
        <option value="App">App</option>
        <option value="Game">Game</option>
        <option value="Tools">Tools</option>

      </select>

      <input
        id="appVersion"
        type="text"
        placeholder="Version e.g. 1.0.0"
        required>

      <input
        id="appSize"
        type="text"
        placeholder="Size e.g. 100 MB"
        required>

      <input
        id="iconUrl"
        type="url"
        placeholder="Icon URL"
        required>

      <input
        id="downloadUrl"
        type="url"
        placeholder="Download URL"
        required>

      <button
        class="admin-btn"
        type="submit">
        Save App
      </button>

    </form>

    <p id="message"></p>

  </div>


  <!-- APP LIST -->

  <div class="admin-box">

    <h2>Saved Apps</h2>

    <div id="appList">
      Loading apps...
    </div>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://mcjsihyrkzrkvkufvkif.supabase.co";


/*
  IMPORTANT:
  नीचे YOUR_PUBLISHABLE_KEY को अपनी
  existing Supabase publishable key से replace करो.
  Service-role / secret key कभी मत डालना.
*/

const SUPABASE_KEY =
  "YOUR_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



async function checkLogin() {

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();


  if (error || !data.session) {

    window.location.href = "index.html";

    return;

  }


  const user =
    data.session.user;


  const {
    data: admin,
    error: adminError
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


  if (adminError || !admin) {

    await supabaseClient.auth.signOut();

    alert("Access denied. Admin only.");

    window.location.href = "index.html";

    return;

  }


  document.getElementById("status").textContent =
    "Admin verification successful.";


  loadApps();

}



async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";

}



document
  .getElementById("addAppForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();


    const message =
      document.getElementById("message");


    message.textContent =
      "Saving app...";


    const name =
      document.getElementById("appName").value.trim();


    const category =
      document.getElementById("appCategory").value;


    const version =
      document.getElementById("appVersion").value.trim();


    const size =
      document.getElementById("appSize").value.trim();


    const icon_url =
      document.getElementById("iconUrl").value.trim();


    const download_url =
      document.getElementById("downloadUrl").value.trim();


    const {
      error
    } =
      await supabaseClient
        .from("apps")
        .insert({
          name: name,
          category: category,
          version: version,
          size: size,
          icon_url: icon_url,
          download_url: download_url
        });


    if (error) {

      message.textContent =
        "Error: " + error.message;

      return;

    }


    message.textContent =
      "App added successfully!";


    document
      .getElementById("addAppForm")
      .reset();


    loadApps();

  });



async function loadApps() {

  const appList =
    document.getElementById("appList");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("apps")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    appList.innerHTML =
      "<p>Unable to load apps.</p>";

    return;

  }


  if (!data || data.length === 0) {

    appList.innerHTML =
      "<p>No apps added yet.</p>";

    return;

  }


  appList.innerHTML =
    data.map(function(app) {

      return `
        <div class="app-item">

          <strong>${escapeHtml(app.name)}</strong>

          <p>
            ${escapeHtml(app.category)}
            • v${escapeHtml(app.version || "")}
            • ${escapeHtml(app.size || "")}
          </p>

        </div>
      `;

    }).join("");

}



function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


checkLogin();

</script>

</body>
</html>
